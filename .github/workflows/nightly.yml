name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC daily
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Nightly Build
    runs-on: ubuntu-latest
    if: github.repository_owner == 'tappify-dev'  # Only run on main repo
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Create nightly tarball
        run: |
          DATE=$(date +%Y%m%d)
          VERSION="0.0.0-nightly.$DATE"
          npm version $VERSION --no-git-tag-version
          npm pack

      - name: Upload nightly build
        uses: actions/upload-artifact@v4
        with:
          name: app-builder-nightly-${{ github.sha }}
          path: '*.tgz'
          retention-days: 14

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly build failed',
              body: `The nightly build failed. Please check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`,
              labels: ['ci', 'build-failure']
            })
