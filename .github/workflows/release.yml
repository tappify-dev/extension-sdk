name: Release

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main, develop]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare release branches
        env:
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # semantic-release resolves tags against local release branch refs.
          git fetch --tags origin \
            '+refs/heads/main:refs/heads/main' \
            '+refs/heads/develop:refs/heads/develop'
          # Keep the triggering branch attached at the commit that passed CI.
          git checkout -B "$RELEASE_BRANCH" "$RELEASE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Supply the repository npm token to semantic-release and setup-node's
      # registry config when trusted publishing is unavailable.
      - name: Release
        # workflow_run defaults to main; pass the triggering run's identity.
        run: |
          GITHUB_REF="refs/heads/$RELEASE_BRANCH" \
            GITHUB_SHA="$RELEASE_SHA" \
            npx semantic-release
        env:
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # semantic-release creates and pushes the version tag before it publishes.
      # If the run failed BEFORE the package reached npm, delete that tag so the
      # next run retries the same version. If it's already on npm (failure came
      # from a later step), keep the tag to avoid a conflicting republish.
      - name: Roll back tag on failed release
        if: failure()
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if npm view "@tappify/extension-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION already on npm — keeping tag $TAG (failure was post-publish)"
          else
            echo "Release failed before publish — deleting tag $TAG so it can be retried"
            git push origin --delete "$TAG" || echo "No remote tag $TAG to delete"
            git tag -d "$TAG" || echo "No local tag $TAG to delete"
          fi
