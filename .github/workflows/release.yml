name: Release

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main, develop]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # No NPM_TOKEN: publishing authenticates via GitHub OIDC (trusted
      # publisher configured on npmjs). id-token: write is granted above.
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release creates and pushes the version tag before it publishes.
      # If the run failed BEFORE the package reached npm, delete that tag so the
      # next run retries the same version. If it's already on npm (failure came
      # from a later step), keep the tag to avoid a conflicting republish.
      - name: Roll back tag on failed release
        if: failure()
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if npm view "@tappify/extension-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION already on npm — keeping tag $TAG (failure was post-publish)"
          else
            echo "Release failed before publish — deleting tag $TAG so it can be retried"
            git push origin --delete "$TAG" || echo "No remote tag $TAG to delete"
            git tag -d "$TAG" || echo "No local tag $TAG to delete"
          fi
